# Especificação OpenAPI da API Petora (lida pelo swagger-jsdoc).
# Todas as rotas exigem Bearer token, exceto POST /auth/login.

tags:
- name: Auth
  description: Login e perfil do usuário autenticado
- name: Gerentes
  description: 'Leitura: GERENTE. Criação e edição: GERENTE. Exclusão: GERENTE.'
- name: Veterinários
  description: 'Leitura: autenticado. Criação e edição: GERENTE. Exclusão: GERENTE.'
- name: Tutores
  description: 'Leitura: autenticado. Criação e edição: autenticado. Exclusão: GERENTE.'
- name: Pets
  description: 'Leitura: autenticado. Criação e edição: autenticado. Exclusão: GERENTE.'
- name: Consultas
  description: 'Leitura: autenticado. Criação e edição: autenticado. Exclusão: GERENTE.'
- name: Agendamentos
  description: 'Leitura: autenticado. Criação e edição: autenticado. Exclusão: GERENTE.'
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login de gerente ou veterinário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: E-mail ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Perfil do usuário autenticado
      responses:
        200:
          description: Tipo e dados do usuário (sem senha)
        401:
          description: Token ausente, inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
