            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Perfil sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /gerente/{id}:
