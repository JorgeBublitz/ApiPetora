# Especificação OpenAPI da API Petora (lida pelo swagger-jsdoc).
# Todas as rotas exigem Bearer token, exceto POST /auth/login.

tags:
- name: Auth
  description: >-
    Login e consulta do próprio perfil. POST /auth/login é a única rota pública
    da API; todas as demais exigem o header "Authorization: Bearer <token>".
- name: Gerentes
  description: >-
    Área administrativa, restrita a GERENTE em toda a rota (leitura, criação,
    edição e exclusão). Veterinários recebem 403 em qualquer operação aqui.
    Um gerente não pode excluir a própria conta (400).
- name: Veterinários
  description: >-
    Leitura: qualquer usuário autenticado (GERENTE ou VETERINARIO). Criação,
    edição e exclusão: somente GERENTE (cadastro de equipe é decisão administrativa).
- name: Tutores
  description: >-
    Leitura e cadastro/edição: qualquer usuário autenticado. Exclusão: somente
    GERENTE. Excluir um tutor também remove, em cascata, seus pets e o histórico
    (consultas e agendamentos) desses pets.
- name: Pets
  description: >-
    Leitura e cadastro/edição: qualquer usuário autenticado. Exclusão: somente
    GERENTE. Excluir um pet também remove, em cascata, seus agendamentos e consultas.
- name: Consultas
  description: >-
    Registro de atendimentos veterinários. Leitura e cadastro/edição: qualquer
    usuário autenticado. Exclusão: somente GERENTE.
- name: Agendamentos
  description: >-
    Agendamento de serviços gerais do petshop (banho, tosa etc). Leitura e
    cadastro/edição: qualquer usuário autenticado. Exclusão: somente GERENTE.
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Autenticar e obter token JWT
      description: >-
        Autentica por e-mail e senha contra as tabelas de Gerente e Veterinario
        (e-mail é único em cada tabela, verificado nessa ordem). Por segurança,
        a mensagem de erro é sempre a mesma ("E-mail ou senha inválidos.") tanto
        para e-mail inexistente quanto para senha incorreta, para não revelar quais
        e-mails estão cadastrados. Em caso de sucesso, retorna um token JWT que deve
        ser enviado como "Authorization: Bearer <token>" nas demais rotas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          description: Corpo da requisição inválido (e-mail mal formatado ou senha ausente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: E-mail não cadastrado ou senha incorreta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Obter o perfil do usuário autenticado
      description: >-
        Retorna o tipo de perfil (GERENTE ou VETERINARIO) e os dados cadastrais
        do usuário do token, sem o campo de senha. Para veterinários, inclui
        também o resumo das consultas que ele realizou.
      responses:
        200:
          description: Perfil do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /gerente:
    get:
      tags:
      - Gerentes
      summary: Listar todos os gerentes
      description: Restrito a GERENTE. Retorna um array (vazio quando não há registros), nunca 404.
      responses:
        200:
          description: Lista de gerentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GerenteOutput'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (rota restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    post:
      tags:
      - Gerentes
      summary: Cadastrar um novo gerente
      description: >-
        Restrito a GERENTE. A senha deve ter no mínimo 6 caracteres, com pelo
        menos um número e um caractere especial, e é armazenada com hash (bcrypt).
        O e-mail deve ser único entre Gerente e Veterinario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GerenteInput'
      responses:
        201:
          description: Gerente criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GerenteRespostaEscrita'
        400:
          description: Dados inválidos (nome vazio, e-mail mal formatado ou senha fora das regras).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (rota restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: E-mail já cadastrado (em Gerente ou em Veterinario).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /gerente/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1
      description: ID numérico do gerente.
    get:
      tags:
      - Gerentes
      summary: Buscar um gerente por ID
      description: Restrito a GERENTE.
      responses:
        200:
          description: Gerente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GerenteOutput'
        400:
          description: ID inválido (não numérico ou menor que 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (rota restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum gerente com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      tags:
      - Gerentes
      summary: Atualizar um gerente
      description: >-
        Restrito a GERENTE. Todos os campos do corpo são opcionais (atualização
        parcial); envie apenas os que deseja alterar. Se "senha" for enviada,
        as mesmas regras de força da criação se aplicam e ela é re-hasheada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GerenteUpdate'
      responses:
        200:
          description: Gerente atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GerenteRespostaEscrita'
        400:
          description: Dados inválidos (formato de e-mail ou senha fora das regras).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (rota restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum gerente com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags:
      - Gerentes
      summary: Remover um gerente
      description: >-
        Restrito a GERENTE. Um gerente não pode remover a própria conta
        (retorna 400 em vez de 200, para evitar perda de acesso administrativo).
      responses:
        200:
          description: Gerente removido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResposta'
        400:
          description: Tentativa de remover a própria conta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (rota restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum gerente com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: (Não deve ocorrer na prática — Gerente não possui dependências com FK.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /veterinario:
    get:
      tags:
      - Veterinários
      summary: Listar todos os veterinários
      description: >-
        Qualquer usuário autenticado. Retorna um array (vazio quando não há
        registros), incluindo o resumo das consultas de cada veterinário.
      responses:
        200:
          description: Lista de veterinários.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VeterinarioOutput'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    post:
      tags:
      - Veterinários
      summary: Cadastrar um novo veterinário
      description: >-
        Restrito a GERENTE. A senha deve ter no mínimo 6 caracteres, com pelo
        menos um número e um caractere especial, e é armazenada com hash (bcrypt).
        O e-mail deve ser único entre Gerente e Veterinario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeterinarioInput'
      responses:
        201:
          description: Veterinário criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeterinarioRespostaEscrita'
        400:
          description: Dados inválidos (nome/especialidade vazios, e-mail mal formatado ou senha fora das regras).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (cadastro restrito a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: E-mail já cadastrado (em Gerente ou em Veterinario).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /veterinario/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1
      description: ID numérico do veterinário.
    get:
      tags:
      - Veterinários
      summary: Buscar um veterinário por ID
      description: Qualquer usuário autenticado.
      responses:
        200:
          description: Veterinário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeterinarioOutput'
        400:
          description: ID inválido (não numérico ou menor que 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum veterinário com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      tags:
      - Veterinários
      summary: Atualizar um veterinário
      description: >-
        Restrito a GERENTE. Todos os campos do corpo são opcionais (atualização
        parcial). Se "senha" for enviada, as mesmas regras de força da criação
        se aplicam e ela é re-hasheada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VeterinarioUpdate'
      responses:
        200:
          description: Veterinário atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeterinarioRespostaEscrita'
        400:
          description: Dados inválidos (formato de e-mail ou senha fora das regras).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (edição restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum veterinário com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags:
      - Veterinários
      summary: Remover um veterinário
      description: >-
        Restrito a GERENTE. Falha com 409 se o veterinário tiver consultas
        vinculadas (chave estrangeira em Consulta.veterinarioId).
      responses:
        200:
          description: Veterinário removido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResposta'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (exclusão restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum veterinário com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: O veterinário possui consultas vinculadas e não pode ser removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /tutor:
    get:
      tags:
      - Tutores
      summary: Listar todos os tutores
      description: >-
        Qualquer usuário autenticado. Retorna um array (vazio quando não há
        registros), incluindo os pets de cada tutor.
      responses:
        200:
          description: Lista de tutores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TutorOutput'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    post:
      tags:
      - Tutores
      summary: Cadastrar um novo tutor
      description: Qualquer usuário autenticado. "telefone" e "endereco" são opcionais.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorInput'
      responses:
        201:
          description: Tutor criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorRespostaEscrita'
        400:
          description: Dados inválidos (nome com menos de 3 caracteres ou e-mail mal formatado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: E-mail já cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /tutor/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1
      description: ID numérico do tutor.
    get:
      tags:
      - Tutores
      summary: Buscar um tutor por ID
      description: Qualquer usuário autenticado. Inclui os pets do tutor.
      responses:
        200:
          description: Tutor encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorOutput'
        400:
          description: ID inválido (não numérico ou menor que 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum tutor com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      tags:
      - Tutores
      summary: Atualizar um tutor
      description: Qualquer usuário autenticado. Todos os campos do corpo são opcionais (atualização parcial).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorUpdate'
      responses:
        200:
          description: Tutor atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorRespostaEscrita'
        400:
          description: Dados inválidos (nome com menos de 3 caracteres ou e-mail mal formatado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum tutor com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags:
      - Tutores
      summary: Remover um tutor
      description: >-
        Restrito a GERENTE. Remove também, em cascata (em uma única transação),
        os pets do tutor e os agendamentos e consultas desses pets.
      responses:
        200:
          description: Tutor removido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResposta'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        403:
          description: Autenticado como VETERINARIO (exclusão restrita a GERENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum tutor com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        409:
          description: (Não deve ocorrer na prática — pets e histórico do tutor são removidos em cascata antes do delete.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /pet:
    get:
      tags:
      - Pets
      summary: Listar todos os pets
      description: >-
        Qualquer usuário autenticado. Retorna um array (vazio quando não há
        registros), incluindo os agendamentos e consultas de cada pet.
      responses:
        200:
          description: Lista de pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetOutput'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    post:
      tags:
      - Pets
      summary: Cadastrar um novo pet
      description: >-
        Qualquer usuário autenticado. "tutorId" deve apontar para um tutor
        existente; caso contrário a API retorna 400 (violação de chave estrangeira).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        201:
          description: Pet criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetRespostaEscrita'
        400:
          description: Dados inválidos (campos obrigatórios ausentes, data inválida) ou "tutorId" inexistente.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErroValidacao'
                - $ref: '#/components/schemas/Erro'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /pet/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1
      description: ID numérico do pet.
    get:
      tags:
      - Pets
      summary: Buscar um pet por ID
      description: Qualquer usuário autenticado. Inclui os agendamentos e consultas do pet.
      responses:
        200:
          description: Pet encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetOutput'
        400:
          description: ID inválido (não numérico ou menor que 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum pet com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    put:
      tags:
      - Pets
      summary: Atualizar um pet
      description: >-
        Qualquer usuário autenticado. Todos os campos do corpo são opcionais
        (atualização parcial). Se "tutorId" for enviado, deve apontar para um
        tutor existente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetUpdate'
      responses:
        200:
          description: Pet atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetRespostaEscrita'
        400:
          description: Dados inválidos (formato de data) ou "tutorId" inexistente.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErroValidacao'
                - $ref: '#/components/schemas/Erro'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        404:
          description: Nenhum pet com esse ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags:
      - Pets
      summary: Remover um pet
      description: >-
        Restrito a GERENTE. Remove também, em cascata (em uma única transação),
        os agendamentos e consultas do pet.
      responses:
        200:
          description: Pet removido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResposta'
        401:
          description: Token ausente, inválido ou expirado.
          content:
            application/json:
              schema:
