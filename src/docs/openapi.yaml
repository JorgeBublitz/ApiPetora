components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token obtido em POST /auth/login. Envie como "Authorization: Bearer <token>".
  schemas:
    # ---------- Erros (componentes compartilhados, usados em toda a API) ----------
    Erro:
      type: object
      description: Formato padrão de erro simples (401, 403, 404, 409 e demais falhas de negócio).
      properties:
        error:
          type: string
          example: Registro não encontrado.
      required:
      - error
    ErroValidacao:
      type: object
      description: >-
        Formato de erro de validação (400), retornado pelo middleware Zod global.
        "erros" lista cada campo inválido com sua mensagem específica.
      properties:
        error:
          type: string
          example: Dados inválidos.
        erros:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
                example: email
              mensagem:
                type: string
                example: Email inválido.
            required:
            - campo
            - mensagem
      required:
      - error
      - erros
    MensagemResposta:
      type: object
      description: Confirmação simples de sucesso, usada nas respostas de DELETE.
      properties:
        message:
          type: string
          example: Registro deletado com sucesso.
      required:
      - message

    # ---------- Auth ----------
    LoginRequest:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          example: alice@admin.com
          format: email
        senha:
          type: string
          example: senha1234
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsInRpcG8iOiJHRVJFTlRFIn0.4pQx8...
        tipo:
          type: string
          enum:
          - GERENTE
          - VETERINARIO
          example: GERENTE
        usuario:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nome:
              type: string
              example: Alice Silva
            email:
              type: string
              example: alice@admin.com
    AuthMeResponse:
      type: object
      description: >-
        "usuario" tem o formato de GerenteOutput quando tipo=GERENTE, ou de
        VeterinarioOutput (com o resumo de consultas) quando tipo=VETERINARIO.
      properties:
        tipo:
          type: string
          enum:
          - GERENTE
          - VETERINARIO
          example: VETERINARIO
        usuario:
          oneOf:
          - $ref: '#/components/schemas/GerenteOutput'
          - $ref: '#/components/schemas/VeterinarioOutput'

    # ---------- Gerente ----------
    GerenteInput:
      type: object
      required:
      - nome
      - email
      - senha
      properties:
        nome:
          type: string
          example: Alice Silva
        email:
          type: string
          example: alice@admin.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com pelo menos um número e um caractere especial.
          example: Senha@123
    GerenteUpdate:
      type: object
      description: Atualização parcial — todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Alice Silva
        email:
          type: string
          example: alice@admin.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com pelo menos um número e um caractere especial.
          example: Senha@123
    GerenteOutput:
      type: object
      description: Nunca inclui o campo de senha.
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Alice Silva
        email:
          type: string
          example: alice@admin.com
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T13:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-02-20T09:30:00.000Z'
    GerenteRespostaEscrita:
      type: object
      description: Envelope de resposta de POST/PUT, com mensagem de confirmação e o registro salvo.
      properties:
        message:
          type: string
          example: Gerente criado com sucesso.
        data:
          $ref: '#/components/schemas/GerenteOutput'

    # ---------- Veterinário ----------
    VeterinarioInput:
      type: object
      required:
      - nome
      - email
      - senha
      - especialidade
      properties:
        nome:
          type: string
          example: Dra. Fernanda
        email:
          type: string
          example: fernanda@vet.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com pelo menos um número e um caractere especial.
          example: Senha@123
        especialidade:
          type: string
          example: Cardiologia
    VeterinarioUpdate:
      type: object
      description: Atualização parcial — todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Dra. Fernanda
        email:
          type: string
          example: fernanda@vet.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com pelo menos um número e um caractere especial.
          example: Senha@123
        especialidade:
          type: string
          example: Cardiologia
    VeterinarioOutput:
      type: object
      description: Nunca inclui o campo de senha. "consulta" é o resumo das consultas atendidas por esse veterinário.
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Dra. Fernanda
        email:
          type: string
          example: fernanda@vet.com
        especialidade:
          type: string
          example: Cardiologia
        consulta:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 10
              data:
                type: string
                format: date-time
                example: '2026-10-11T09:00:00.000Z'
              descricao:
                type: string
                example: Check-up cardíaco
              tratamento:
                type: string
                nullable: true
                example: Nenhum, apenas acompanhamento
              petId:
                type: integer
                example: 1
    VeterinarioRespostaEscrita:
      type: object
      description: Envelope de resposta de POST/PUT, com mensagem de confirmação e o registro salvo.
      properties:
        message:
          type: string
          example: Veterinário criado com sucesso.
        data:
          $ref: '#/components/schemas/VeterinarioOutput'

    # ---------- Tutor ----------
    TutorInput:
      type: object
      required:
      - nome
      - email
      properties:
        nome:
          type: string
          example: Carlos Souza
          minLength: 3
        email:
          type: string
          example: carlos@email.com
          format: email
        telefone:
          type: string
          example: (83) 99999-0000
        endereco:
          type: string
          example: Rua das Acácias, 123, Bairro dos Estados
    TutorUpdate:
      type: object
      description: Atualização parcial — todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Carlos Souza
          minLength: 3
        email:
          type: string
          example: carlos@email.com
          format: email
        telefone:
          type: string
          example: (83) 99999-0000
        endereco:
          type: string
          example: Rua das Acácias, 123, Bairro dos Estados
    TutorOutput:
      type: object
      description: O array "pets" só é incluído nas respostas de GET (listar e buscar por ID).
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Carlos Souza
        email:
          type: string
          example: carlos@email.com
        telefone:
          type: string
          nullable: true
          example: (83) 99999-0000
        endereco:
          type: string
          nullable: true
          example: Rua das Acácias, 123, Bairro dos Estados
        createdAt:
          type: string
          format: date-time
          example: '2026-01-10T12:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-10T12:00:00.000Z'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/PetOutput'
    TutorRespostaEscrita:
      type: object
      description: >-
        Envelope de resposta de POST/PUT, com mensagem de confirmação e o
        registro salvo (sem o array "pets", presente apenas nas respostas de GET).
      properties:
        message:
          type: string
          example: Tutor criado com sucesso.
        data:
          $ref: '#/components/schemas/TutorOutput'

    # ---------- Pet ----------
    PetInput:
      type: object
      required:
      - nome
      - especie
      - raca
      - dataNascimento
      - tutorId
      properties:
        nome:
          type: string
          example: Rex
        especie:
          type: string
          example: Cachorro
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          example: '2018-05-10'
          format: date
        tutorId:
          type: integer
          description: ID de um tutor já cadastrado.
          example: 1
    PetUpdate:
      type: object
      description: Atualização parcial — todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Rex
        especie:
          type: string
          example: Cachorro
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          example: '2018-05-10'
          format: date
        tutorId:
          type: integer
          description: ID de um tutor já cadastrado.
          example: 1
    PetOutput:
      type: object
      description: Os arrays "agendamentos" e "consultas" só são incluídos nas respostas de GET (listar e buscar por ID).
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Rex
        especie:
          type: string
          example: Cachorro
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          format: date-time
          example: '2018-05-10T00:00:00.000Z'
        tutorId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: '2026-01-12T08:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-12T08:00:00.000Z'
        agendamentos:
          type: array
          items:
            $ref: '#/components/schemas/AgendamentoOutput'
        consultas:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaOutput'
    PetRespostaEscrita:
      type: object
      description: >-
        Envelope de resposta de POST/PUT, com mensagem de confirmação e o
        registro salvo (sem os arrays "agendamentos"/"consultas", presentes apenas nas respostas de GET).
      properties:
        message:
          type: string
          example: Pet criado com sucesso.
        data:
          $ref: '#/components/schemas/PetOutput'

    # ---------- Consulta ----------
    ConsultaInput:
      type: object
      required:
      - data
      - veterinarioId
      - petId
      - descricao
      properties:
        data:
          type: string
          example: '2026-10-01T14:00:00.000Z'
          format: date-time
        veterinarioId:
          type: integer
          description: ID de um veterinário já cadastrado.
          example: 1
        petId:
          type: integer
          description: ID de um pet já cadastrado.
          example: 1
        descricao:
          type: string
          example: Check-up cardíaco anual
        tratamento:
          type: string
          description: Opcional.
          example: Nenhum, apenas acompanhamento
    ConsultaUpdate:
      type: object
      description: Atualização parcial — todos os campos são opcionais.
      properties:
        data:
          type: string
          example: '2026-10-01T14:00:00.000Z'
          format: date-time
        veterinarioId:
          type: integer
          description: ID de um veterinário já cadastrado.
          example: 1
        petId:
          type: integer
          description: ID de um pet já cadastrado.
          example: 1
        descricao:
          type: string
          example: Check-up cardíaco anual
        tratamento:
          type: string
          description: Opcional.
          example: Nenhum, apenas acompanhamento
    ConsultaOutput:
      type: object
      properties:
        id:
          type: integer
          example: 1
        data:
          type: string
          format: date-time
          example: '2026-10-01T14:00:00.000Z'
        veterinarioId:
          type: integer
          example: 1
        petId:
          type: integer
          example: 1
        descricao:
          type: string
          example: Check-up cardíaco anual
        tratamento:
          type: string
          nullable: true
          example: Nenhum, apenas acompanhamento
        createdAt:
          type: string
          format: date-time
          example: '2026-09-20T11:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-09-20T11:00:00.000Z'
    ConsultaRespostaEscrita:
      type: object
      description: Envelope de resposta de POST/PUT, com mensagem de confirmação e o registro salvo.
      properties:
        message:
          type: string
          example: Consulta criada com sucesso.
        data:
          $ref: '#/components/schemas/ConsultaOutput'

    # ---------- Agendamento ----------
    AgendamentoInput:
      type: object
      required:
      - data
      - servico
      - petId
      properties:
