components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        error:
          type: string
    ErroValidacao:
      type: object
      properties:
        error:
          type: string
          example: Dados inválidos.
        erros:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string
    LoginRequest:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          example: alice@admin.com
          format: email
        senha:
          type: string
          example: senha1234
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          enum:
          - GERENTE
          - VETERINARIO
        usuario:
          type: object
          properties:
            id:
              type: integer
            nome:
              type: string
            email:
              type: string
    GerenteInput:
      type: object
      required:
      - nome
      - email
      - senha
      properties:
        nome:
          type: string
          example: Alice Silva
        email:
          type: string
          example: alice@admin.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com número e caractere especial.
          example: Senha@123
    GerenteUpdate:
      type: object
      description: Todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Alice Silva
        email:
          type: string
          example: alice@admin.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com número e caractere especial.
          example: Senha@123
    VeterinarioInput:
      type: object
      required:
      - nome
      - email
      - senha
      - especialidade
      properties:
        nome:
          type: string
          example: Dra. Paula
        email:
          type: string
          example: paula@vet.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com número e caractere especial.
          example: Senha@123
        especialidade:
          type: string
          example: Clínica geral
    VeterinarioUpdate:
      type: object
      description: Todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Dra. Paula
        email:
          type: string
          example: paula@vet.com
          format: email
        senha:
          type: string
          minLength: 6
          description: Mínimo 6 caracteres, com número e caractere especial.
          example: Senha@123
        especialidade:
          type: string
          example: Clínica geral
    TutorInput:
      type: object
      required:
      - nome
      - email
      properties:
        nome:
          type: string
          example: Carlos Souza
          minLength: 3
        email:
          type: string
          example: carlos@email.com
          format: email
        telefone:
          type: string
          example: (83) 99999-0000
        endereco:
          type: string
          example: Rua A, 123
    TutorUpdate:
      type: object
      description: Todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Carlos Souza
          minLength: 3
        email:
          type: string
          example: carlos@email.com
          format: email
        telefone:
          type: string
          example: (83) 99999-0000
        endereco:
          type: string
          example: Rua A, 123
    PetInput:
      type: object
      required:
      - nome
      - especie
      - raca
      - dataNascimento
      - tutorId
      properties:
        nome:
          type: string
          example: Rex
        especie:
          type: string
          example: Cachorro
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          example: '2020-05-10'
          format: date
        tutorId:
          type: integer
          example: 1
    PetUpdate:
      type: object
      description: Todos os campos são opcionais.
      properties:
        nome:
          type: string
          example: Rex
        especie:
          type: string
          example: Cachorro
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          example: '2020-05-10'
          format: date
        tutorId:
          type: integer
          example: 1
    ConsultaInput:
      type: object
      required:
      - data
      - veterinarioId
      - petId
      - descricao
      properties:
        data:
          type: string
          example: '2026-10-01T14:00:00.000Z'
          format: date-time
        veterinarioId:
          type: integer
          example: 1
        petId:
          type: integer
          example: 1
        descricao:
          type: string
          example: Check-up anual
        tratamento:
          type: string
          example: Vermífugo
    ConsultaUpdate:
      type: object
      description: Todos os campos são opcionais.
      properties:
        data:
          type: string
          example: '2026-10-01T14:00:00.000Z'
          format: date-time
        veterinarioId:
          type: integer
          example: 1
        petId:
          type: integer
          example: 1
        descricao:
          type: string
          example: Check-up anual
        tratamento:
          type: string
          example: Vermífugo
    AgendamentoInput:
      type: object
      required:
      - data
